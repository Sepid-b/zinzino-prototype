<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zinzino · Return</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --black:#1A1A1A;
  --g1:#F5F5F5;--g2:#E8E8E8;--g3:#ADADAD;--g4:#666;
  --sf:#fff;--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#DEDEDE;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px 60px}
.wrap{display:flex;flex-direction:column;align-items:center}
.dlabel{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#999;margin-bottom:10px}
.phone{width:375px;max-width:calc(100vw - 24px);background:#fff;border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 32px 72px rgba(0,0,0,.18);display:flex;flex-direction:column}
.sbar{background:#fff;padding:13px 26px 5px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--black);flex-shrink:0}
.nav{background:#fff;padding:10px 18px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--g2);flex-shrink:0}
.back-btn{width:34px;height:34px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .1s;border:none}
.back-btn:hover{background:var(--g2)}.back-btn.h{visibility:hidden;pointer-events:none}
.nav-title{font-size:15px;font-weight:700;color:var(--black);flex:1;text-align:center}
.nav-ghost{width:34px;flex-shrink:0}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;background:#fff;min-height:540px;max-height:620px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
@keyframes fs{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.steps{display:flex;justify-content:center;gap:6px;padding:16px 0 4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--g2);transition:all .22s}
.dot.active{background:var(--black);width:18px;border-radius:100px}
.dot.done{background:var(--g3)}
.btn{width:100%;padding:16px 20px;border-radius:100px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;border:none;margin-bottom:10px;transition:opacity .1s,transform .08s;letter-spacing:-.01em}
.btn:active{transform:scale(.98);opacity:.85}
.btn-black{background:var(--black);color:#fff}
.btn-outline{background:#fff;color:var(--black);border:2px solid var(--black)}
.btn-ghost{background:transparent;color:var(--g3);font-size:13px;font-weight:600;padding:10px}
.btn-sm{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:100px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--g2);background:#fff;color:var(--black);transition:background .1s}
.btn-sm:hover{background:var(--g1)}
.kcard{background:#fff;border:1px solid var(--g2);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.krow{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--g2)}
.krow:last-child{border-bottom:none}
.kk{font-size:13px;color:var(--g4);font-weight:500}
.kv{font-size:13px;color:var(--black);font-weight:700}
.banner{border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.55;margin-bottom:14px;display:flex;gap:11px;align-items:flex-start;background:var(--g1);border:1px solid var(--g2);color:var(--black)}
.banner-warn{background:#fff;border:1.5px solid var(--black)}
.prod-row{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--g2);cursor:pointer;transition:background .09s;user-select:none}
.prod-row:last-child{border-bottom:none}
.prod-row:hover{background:var(--g1)}.prod-row.disabled{opacity:.35;pointer-events:none}
.prod-ic{width:44px;height:44px;border-radius:12px;background:var(--g1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prod-n{font-size:13px;font-weight:700;color:var(--black);line-height:1.3}
.prod-d{font-size:11px;color:var(--g3);margin-top:2px}
.prod-p{font-size:13px;font-weight:700;color:var(--black);white-space:nowrap;flex-shrink:0}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--g2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s;background:#fff}
.chk.on{border-color:var(--black);background:var(--black)}
.sel-all{display:flex;align-items:center;gap:13px;padding:13px 18px;border-bottom:2px solid var(--g2);cursor:pointer;user-select:none;background:var(--g1);transition:background .09s}
.sel-all:hover{background:#EBEBEB}
.sel-all-t{font-size:12px;font-weight:700;color:var(--black);flex:1}
.sel-all-chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--g2);display:flex;align-items:center;justify-content:center;transition:all .12s;background:#fff;flex-shrink:0}
.sel-all-chk.on{border-color:var(--black);background:var(--black)}
.yn-opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--g2);cursor:pointer;transition:background .09s}
.yn-opt:last-child{border-bottom:none}
.yn-opt:hover{background:var(--g1)}.yn-opt:active{background:var(--g2)}
.yn-ic{width:42px;height:42px;border-radius:12px;background:var(--g1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.yn-t{font-size:14px;font-weight:700;color:var(--black)}
.yn-s{font-size:12px;color:var(--g4);margin-top:2px;line-height:1.4}
.blocked-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--g4);background:var(--g1);border:1px solid var(--g2);border-radius:5px;padding:2px 7px;margin-top:3px}
/* Accordion */
.acc-item{border-bottom:1px solid var(--g2)}
.acc-item:last-child{border-bottom:none}
.acc-hd{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer;user-select:none;transition:background .09s}
.acc-hd:hover{background:var(--g1)}
.acc-ic{width:36px;height:36px;border-radius:10px;background:var(--g1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-title{font-size:14px;font-weight:700;color:var(--black);flex:1}
.acc-chevron{transition:transform .22s;flex-shrink:0}
.acc-chevron.open{transform:rotate(180deg)}
.acc-body{overflow:hidden;max-height:0;transition:max-height .28s ease}
.acc-body.open{max-height:220px}
.acc-content{padding:0 18px 16px 67px;font-size:13px;color:var(--g4);line-height:1.65}
/* Timeline */
.tl-wrap{padding:2px 0}
.tl-item{display:flex;gap:13px;align-items:flex-start;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:18px}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tl-dot.done{background:var(--black)}.tl-dot.wait{background:var(--g2);border:2px solid var(--g3)}
.tl-line{width:2px;flex:1;background:var(--g2);min-height:18px;margin-top:3px}
.tl-tx{font-size:13px;color:var(--black);line-height:1.4}
.tl-tx.dim{color:var(--g3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="dlabel">Prototype · Withdrawal flow</div>
  <div class="phone">
    <div class="sbar">
      <span id="clk">9:41</span>
      <span style="display:flex;align-items:center;gap:5px">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="7" width="3" height="4" rx="1" fill="#1A1A1A"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#1A1A1A"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#1A1A1A"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#1A1A1A"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" fill="#1A1A1A"/><path d="M5.17 7.17a4 4 0 0 1 5.66 0" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/><path d="M2.34 4.34a8 8 0 0 1 11.32 0" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1A1A1A" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1A1A1A"/><path d="M23 4v4a2 2 0 0 0 0-4z" fill="#1A1A1A" fill-opacity=".4"/></svg>
      </span>
    </div>
    <div class="nav">
      <button class="back-btn h" id="back-btn" onclick="goBack()">
        <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L1 8l7 7" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nav-title" id="nav-t">My Orders</div>
      <div class="nav-ghost"></div>
    </div>
    <div class="scr" id="scr"></div>
  </div>
</div>
<script>
const IC = {
  chevron:`<svg width="12" height="7" viewBox="0 0 12 7" fill="none"><path d="M1 1l5 5 5-5" stroke="#ADADAD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  chevronR:`<svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1 1l5 5-5 5" stroke="#ADADAD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  check:`<svg width="12" height="9" viewBox="0 0 12 9" fill="none"><path d="M1 4l3.5 3.5L11 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  box:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,
  tag:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  pin:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  pause:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
  info:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  seal:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 10l9-7 9 7"/><line x1="9" y1="21" x2="9" y2="8"/><line x1="15" y1="21" x2="15" y2="8"/></svg>`,
  open:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
  pencil:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  bottle:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6m-4 0v3l-4 4v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V10l-4-4V3"/><line x1="6" y1="10" x2="18" y2="10"/></svg>`,
  flask:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6m-4 0v6L7 16a4 4 0 0 0 3.5 6h3A4 4 0 0 0 17 16l-4-7V3"/><line x1="6.5" y1="14" x2="17.5" y2="14"/></svg>`,
  done:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
};

const ITEMS=[
  {id:1,n:'BalanceOil+ Lemon',d:'300 ml',p:64.00,ic:'bottle'},
  {id:2,n:'BalanceTest',d:'Omega-3 test kit',p:17.00,ic:'flask'},
  {id:3,n:'BalanceTest',d:'Omega-3 test kit',p:17.00,ic:'flask'},
];
const DEMO_OPENED=[3];
let sel={};

const TITLES={ORDER:'My Orders',WD_CHECK:'Return this order',WD_SELECT:'Select items',WD_SUMMARY:'Review return',WD_DONE:'Return confirmed'};
const HISTORY=[];let CURRENT='ORDER';

function go(s){HISTORY.push(CURRENT);CURRENT=s;render();}
function goBack(){if(HISTORY.length){CURRENT=HISTORY.pop();render();}}

function render(){
  document.getElementById('nav-t').textContent=TITLES[CURRENT]||CURRENT;
  document.getElementById('back-btn').classList.toggle('h',HISTORY.length===0);
  const scr=document.getElementById('scr');scr.scrollTop=0;
  SCREENS[CURRENT]?.(scr);
}

function stps(cur,tot){return`<div class="steps">${Array.from({length:tot},(_,i)=>`<div class="dot ${i+1<cur?'done':i+1===cur?'active':''}"></div>`).join('')}</div>`;}
function b(label,cls,fn){return`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;}
function totalRefund(){return ITEMS.filter(o=>sel[o.id]).reduce((a,o)=>a+o.p,0);}

const accOpen={pack:true,label:true,address:true};
function toggleAcc(key){
  accOpen[key]=!accOpen[key];
  document.getElementById('acc-'+key)?.classList.toggle('open',accOpen[key]);
  document.getElementById('chev-'+key)?.classList.toggle('open',accOpen[key]);
}

const SCREENS={

ORDER(el){
  el.innerHTML=`<div style="padding:20px;animation:fs .18s ease">
<div style="font-size:11px;font-weight:700;color:var(--g3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Order #ZN-00128</div>
<div style="font-size:22px;font-weight:900;color:var(--black);letter-spacing:-.03em;margin-bottom:4px">Premier Kit — Balance</div>
<div style="font-size:13px;color:var(--g4);margin-bottom:20px">Delivered 24 Feb 2026</div>
<div class="kcard">
${ITEMS.map(o=>`<div style="display:flex;align-items:center;gap:13px;padding:13px 18px;border-bottom:1px solid var(--g2)"><div class="prod-ic">${IC[o.ic]}</div><div style="flex:1"><div class="prod-n">${o.n}</div><div class="prod-d">${o.d}</div></div><div class="prod-p">€${o.p.toFixed(2)}</div></div>`).join('')}
<div style="padding:13px 18px;display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--g4)">Order total</span><span style="font-size:13px;font-weight:700;color:var(--black)">€${ITEMS.reduce((a,o)=>a+o.p,0).toFixed(2)}</span></div>
</div>
<div class="banner banner-warn" style="margin-bottom:20px"><span style="flex-shrink:0;margin-top:1px">${IC.info}</span><span><strong>6 days left to return</strong> — deadline 24 Mar 2026</span></div>
${b('Return this order','btn-black',"go('WD_CHECK')")}
</div>`;
},

WD_CHECK(el){
  el.innerHTML=`<div style="padding:20px;animation:fs .18s ease">
${stps(1,3)}
<div style="font-size:24px;font-weight:900;color:var(--black);letter-spacing:-.03em;line-height:1.2;margin:8px 0"><br>Are all items<br>still sealed?</div>
<div style="font-size:14px;color:var(--g4);line-height:1.6;margin-bottom:20px">Only <strong style="color:var(--black)">unopened, sealed</strong> products are eligible under the right of withdrawal.</div>
<div class="kcard" style="margin-bottom:20px">
<div class="yn-opt" onclick="ITEMS.forEach(o=>sel[o.id]=true);go('WD_SUMMARY')">
  <div class="yn-ic">${IC.seal}</div>
  <div style="flex:1"><div class="yn-t">Yes — everything is sealed</div><div class="yn-s">Full refund of €${ITEMS.reduce((a,o)=>a+o.p,0).toFixed(2)}</div></div>
  ${IC.chevronR}
</div>
<div class="yn-opt" onclick="ITEMS.forEach(o=>sel[o.id]=false);go('WD_SELECT')">
  <div class="yn-ic">${IC.open}</div>
  <div style="flex:1"><div class="yn-t">No — some items are opened</div><div class="yn-s">Select which sealed items to return.</div></div>
  ${IC.chevronR}
</div>
</div>
<p style="font-size:12px;color:var(--g3);text-align:center;line-height:1.5">Opened items cannot be returned under the right of withdrawal.</p>
</div>`;
},

WD_SELECT(el){
  el.innerHTML=`<div style="animation:fs .18s ease;padding-bottom:24px">
${stps(1,3)}
<div style="padding:18px 20px 10px">
<div style="font-size:24px;font-weight:900;color:var(--black);letter-spacing:-.03em;line-height:1.2;margin:8px 0 12px">Select items<br>to return</div>
<div class="banner" style="margin-bottom:0"><span style="flex-shrink:0;margin-top:1px">${IC.info}</span><span>Only <strong>sealed, unopened</strong> items can be returned. Opened items are not eligible.</span></div>
</div>
<div style="margin:12px 20px 0">
<div class="kcard">
<div class="sel-all" onclick="toggleAll()">
  <div style="width:34px;height:34px;border-radius:10px;background:var(--g2);display:flex;align-items:center;justify-content:center;flex-shrink:0">${IC.box}</div>
  <div class="sel-all-t">Premier Kit (${ITEMS.length} items)</div>
  <div class="sel-all-chk ${ITEMS.filter(o=>!DEMO_OPENED.includes(o.id)).every(o=>sel[o.id])?'on':''}" id="sa-chk">${ITEMS.filter(o=>!DEMO_OPENED.includes(o.id)).every(o=>sel[o.id])?IC.check:''}</div>
</div>
<div id="ilist">${ITEMS.map(o=>iRow(o)).join('')}</div>
</div>
</div>
<div style="padding:14px 20px 0"><div id="sel-err"></div>${b('Review return','btn-black','chkSel()')}${b('Back','btn-ghost','goBack()')}</div>`;
},

WD_SUMMARY(el){
  const items=ITEMS.filter(o=>sel[o.id]);
  const total=items.reduce((a,o)=>a+o.p,0);
  el.innerHTML=`<div style="padding:20px;animation:fs .18s ease;padding-bottom:28px">
${stps(2,3)}
<div class="banner" style="margin-top:8px"><span style="flex-shrink:0;margin-top:1px">${IC.pause}</span><span><strong>Your subscription will be paused immediately</strong> — no further charges while your return is processed.</span></div>
<div style="font-size:11px;font-weight:700;color:var(--g3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Items you're returning</div>
<div class="kcard">
${items.map(o=>`<div style="display:flex;align-items:center;gap:13px;padding:13px 18px;border-bottom:1px solid var(--g2)"><div class="prod-ic">${IC[o.ic]}</div><div style="flex:1"><div class="prod-n">${o.n}</div><div class="prod-d">${o.d}</div></div><div class="prod-p">€${o.p.toFixed(2)}</div></div>`).join('')}
<div class="krow" style="background:var(--g1)"><span style="font-size:15px;font-weight:900;color:var(--black)">Your refund</span><span style="font-size:18px;font-weight:900;color:var(--black)">€${total.toFixed(2)}</span></div>
</div>
<div style="font-size:11px;font-weight:700;color:var(--g3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Return instructions</div>
<div class="kcard" style="margin-bottom:20px">
<div class="acc-item">
  <div class="acc-hd" onclick="toggleAcc('pack')">
    <div class="acc-ic">${IC.box}</div>
    <div class="acc-title">How to pack your return</div>
    <div class="acc-chevron open" id="chev-pack">${IC.chevron}</div>
  </div>
  <div class="acc-body open" id="acc-pack">
    <div class="acc-content">Pack the items securely in the original box if possible. If not, use any sturdy box. Make sure items are well protected to avoid damage in transit.</div>
  </div>
</div>
<div class="acc-item">
  <div class="acc-hd" onclick="toggleAcc('label')">
    <div class="acc-ic">${IC.tag}</div>
    <div class="acc-title">Shipping label &amp; timeline</div>
    <div class="acc-chevron open" id="chev-label">${IC.chevron}</div>
  </div>
  <div class="acc-body open" id="acc-label">
    <div class="acc-content">A prepaid return label will be sent to your email within 1–3 business days. Print it and attach it to the outside of the box. Drop off at any DHL location.</div>
  </div>
</div>
<div class="acc-item">
  <div class="acc-hd" onclick="toggleAcc('address')">
    <div class="acc-ic">${IC.pin}</div>
    <div class="acc-title">Return shipping address</div>
    <div class="acc-chevron open" id="chev-address">${IC.chevron}</div>
  </div>
  <div class="acc-body open" id="acc-address">
    <div class="acc-content">Zinzino Returns<br>Lilla Bommen 1<br>411 04 Gothenburg<br>Sweden<div style="margin-top:12px"><button class="btn-sm" onclick="event.stopPropagation()">${IC.pencil} Change address</button></div></div>
  </div>
</div>
</div>
${b('Confirm return','btn-black',"go('WD_DONE')")}
${b('Back','btn-outline','goBack()')}
</div>`;
},

WD_DONE(el){
  const total=totalRefund();
  el.innerHTML=`<div style="padding:28px 20px;animation:fs .22s ease;text-align:center">
<div style="width:64px;height:64px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">${IC.done}</div>
<div style="font-size:26px;font-weight:900;color:var(--black);letter-spacing:-.03em;margin-bottom:6px">Return initiated</div>
<div style="font-size:14px;color:var(--g4);line-height:1.6;margin-bottom:24px">Your case is registered.<br>Check your email for next steps.</div>
<div class="kcard" style="text-align:left;margin-bottom:20px">
  <div class="krow"><span class="kk">Case ID</span><span class="kv" style="font-family:monospace;font-size:12px">#RET-20260318-7742</span></div>
  <div class="krow"><span class="kk">Subscription</span><span style="font-size:12px;font-weight:700;background:var(--g1);color:var(--black);padding:3px 10px;border-radius:100px;border:1px solid var(--g2)">Paused</span></div>
  <div class="krow"><span class="kk">Return label</span><span class="kv" style="font-size:12px">Email within 1–3 days</span></div>
  <div class="krow"><span class="kk">Your refund</span><span class="kv" style="font-size:15px">€${total.toFixed(2)}</span></div>
</div>
<div style="text-align:left;margin-bottom:24px">
  <div style="font-size:11px;font-weight:700;color:var(--g3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">What happens next</div>
  <div class="tl-wrap">
    ${[['done','Return label emailed to you'],['done','Subscription paused immediately'],['wait','You ship the items back'],['wait','Zinzino receives your return'],['wait','Refund processed (5–10 business days)']].map(([s,tx],i,a)=>`
    <div class="tl-item"><div class="tl-left"><div class="tl-dot ${s}"></div>${i<a.length-1?'<div class="tl-line"></div>':''}</div><div class="tl-tx ${s==='wait'?'dim':''}">${tx}</div></div>`).join('')}
  </div>
</div>
${b('Back to My Account','btn-outline',"go('ORDER')")}
</div>`;
},
};

function iRow(o){
  const blocked=DEMO_OPENED.includes(o.id),checked=!!sel[o.id];
  return`<div class="prod-row ${blocked?'disabled':''}" onclick="toggleItem(${o.id})">
  <div class="prod-ic">${IC[o.ic]}</div>
  <div style="flex:1"><div class="prod-n">${o.n}</div><div class="prod-d">${o.d}</div>${blocked?`<span class="blocked-tag">Opened — not eligible</span>`:''}</div>
  <div class="prod-p" style="margin-right:10px">€${o.p.toFixed(2)}</div>
  ${blocked?`<div style="width:22px;flex-shrink:0"></div>`:`<div class="chk ${checked?'on':''}">${checked?IC.check:''}</div>`}
</div>`;
}

function toggleItem(id){if(DEMO_OPENED.includes(id))return;sel[id]=!sel[id];refreshList();}
function toggleAll(){
  const el=ITEMS.filter(o=>!DEMO_OPENED.includes(o.id)),allOn=el.every(o=>sel[o.id]);
  el.forEach(o=>sel[o.id]=!allOn);refreshList();
}
function refreshList(){
  const il=document.getElementById('ilist');if(il)il.innerHTML=ITEMS.map(o=>iRow(o)).join('');
  const el=ITEMS.filter(o=>!DEMO_OPENED.includes(o.id)),sa=document.getElementById('sa-chk');
  if(sa){const on=el.every(o=>sel[o.id]);sa.className=`sel-all-chk ${on?'on':''}`;sa.innerHTML=on?IC.check:'';}
}
function chkSel(){
  if(!ITEMS.some(o=>sel[o.id])){const e=document.getElementById('sel-err');if(e)e.innerHTML=`<p style="font-size:13px;color:var(--black);text-align:center;padding:6px 0 10px;font-weight:700">Please select at least one item.</p>`;return;}
  go('WD_SUMMARY');
}
function tick(){const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');const c=document.getElementById('clk');if(c)c.textContent=h+':'+m;}
tick();setInterval(tick,15000);
render();
</script>
</body>
</html>
