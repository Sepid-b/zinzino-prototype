<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zinzino · Subscription & Returns</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#1a6b4a;--gl:#e8f5f0;--gm:#2d9b6f;
  --t1:#0d1117;--t2:#4b5563;--t3:#9ca3af;--t4:#d1d5db;
  --sf:#fff;--sf2:#f9fafb;--sf3:#f3f4f6;--sf4:#e5e7eb;
  --bd:#e5e7eb;--bd2:#d1d5db;
  --am:#b45309;--aml:#fffbeb;--amb:#fde68a;
  --rd:#dc2626;--rdl:#fef2f2;--rdb:#fecaca;
  --bl:#2563eb;--bll:#eff6ff;--blb:#bfdbfe;
  --pu:#7c3aed;--pul:#f5f3ff;--pub:#ddd6fe;
  --or:#c2410c;--orl:#fff7ed;--orb:#fed7aa;
  --pk:#9d174d;--pkl:#fdf2f8;--pkb:#fbcfe8;
  --gap-bg:#fffbeb;--gap-bd:#fbbf24;--gap-tx:#92400e;
  --risk-bg:#fef2f2;--risk-bd:#f87171;--risk-tx:#991b1b;
  --r8:8px;--r12:12px;--r16:16px;--r20:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:#d8dce3;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px 48px}
.wrap{display:flex;flex-direction:column;align-items:center}
.dlabel{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a9199;margin-bottom:10px}
.phone{width:375px;max-width:calc(100vw - 20px);background:var(--sf2);border-radius:42px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.09),0 24px 60px rgba(0,0,0,.16);display:flex;flex-direction:column}
/* Status bar */
.sbar{background:var(--sf);padding:12px 24px 5px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--t1);flex-shrink:0}
/* Nav */
.nav{background:var(--sf);padding:9px 14px 11px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);flex-shrink:0}
.nav-back{width:32px;height:32px;border-radius:50%;background:var(--sf3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--t1);flex-shrink:0;line-height:1;font-weight:300;transition:background .12s}
.nav-back:hover{background:var(--sf4)}.nav-back.h{visibility:hidden;pointer-events:none}
.nav-title{font-size:14px;font-weight:700;color:var(--t1);flex:1;text-align:center}
.nav-ghost{width:32px;height:32px;flex-shrink:0}
/* Screen */
.scr{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--sf2);min-height:520px;max-height:568px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
/* Bottom nav */
.bnav{background:var(--sf);border-top:1px solid var(--bd);padding:7px 0 15px;display:flex;justify-content:space-around;flex-shrink:0}
.bni{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 10px;opacity:.35}
.bni.on{opacity:1}.bni-ic{font-size:19px}.bni-lb{font-size:8px;font-weight:700;letter-spacing:.04em;color:var(--t2)}
.bni.on .bni-lb{color:var(--g)}
/* screen id */
.sid{margin-top:9px;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a9199}
/* fade */
@keyframes fs{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* ═══════════════ ATOMS ═══════════════ */
.pad{padding:0 14px 24px}.pt{padding-top:14px}
/* cards */
.card{background:var(--sf);border-radius:var(--r16);border:1px solid var(--bd);margin-bottom:9px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cb{padding:14px}
.cr{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}.cr:last-child{border-bottom:none}
.ck{font-size:12px;color:var(--t2);font-weight:500}.cv{font-size:12px;color:var(--t1);font-weight:600}
/* hero */
.hero{background:var(--g);border-radius:var(--r20);padding:18px;margin:11px 14px 0;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(26,107,74,.22)}
.hero::before{content:'';position:absolute;top:-22px;right:-22px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06)}
.hey{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:4px}
.hpd{font-size:17px;font-weight:800;color:#fff;margin-bottom:14px;letter-spacing:-.01em}
.hgr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hgl{font-size:8px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:2px}
.hgv{font-size:15px;font-weight:800;color:#fff}.hgs{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px}
/* badges */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:700}
.bg{background:#dcfce7;color:#15803d}.ba{background:var(--aml);color:var(--am);border:1px solid var(--amb)}
.br{background:var(--rdl);color:var(--rd);border:1px solid var(--rdb)}.bp{background:var(--pul);color:var(--pu)}
.bo{background:var(--orl);color:var(--or);border:1px solid var(--orb)}.bb{background:var(--bll);color:var(--bl);border:1px solid var(--blb)}
.bgr{background:var(--sf3);color:var(--t2)}
.dot-s{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
/* section header */
.sh{padding:14px 14px 7px;display:flex;justify-content:space-between;align-items:center}
.sht{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
/* buttons */
.btn{width:100%;padding:13px 18px;border-radius:var(--r12);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;margin-bottom:7px;transition:opacity .1s,transform .1s}
.btn:active{transform:scale(.98);opacity:.88}
.btn-p{background:var(--g);color:#fff}.btn-s{background:var(--sf);color:var(--t1);border:1px solid var(--bd2)}
.btn-d{background:var(--rdl);color:var(--rd);border:1px solid var(--rdb)}
.btn-g{background:transparent;color:var(--t2);font-size:12px;font-weight:600;text-decoration:underline;text-decoration-color:var(--bd2)}
.btn-amb{background:var(--aml);color:var(--am);border:1px solid var(--amb)}
/* progress */
.pt2{height:4px;background:var(--sf3);border-radius:100px;overflow:hidden}
.pf{height:100%;border-radius:100px}
.pss{display:flex;align-items:center;gap:3px}
.ps{flex:1;height:3px;border-radius:100px}
.psd{background:var(--g)}.psa{background:var(--am)}.psf{background:var(--sf3)}
/* info rows */
.il{display:flex;flex-direction:column;gap:9px}
.ir{display:flex;gap:9px;align-items:flex-start}
.ii{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.iig{background:#dcfce7}.iia{background:var(--aml)}.iir{background:var(--rdl)}.iib{background:var(--bll)}.iigr{background:var(--sf3)}.iip{background:var(--pul)}
.ill{font-size:12px;font-weight:600;color:var(--t1)}.ils{font-size:10px;color:var(--t2);line-height:1.4;margin-top:1px}
/* chips */
.chips{display:flex;gap:5px;margin-bottom:12px}
.chip{flex:1;padding:8px 3px;border-radius:7px;border:1.5px solid var(--bd);background:var(--sf);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;text-align:center;color:var(--t2);transition:all .12s}
.chip.on{border-color:var(--g);color:var(--g);background:var(--gl)}
/* reason */
.ri{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .1s}
.ri:last-child{border-bottom:none}.ri:hover{background:var(--sf2)}.ri.on{background:#f0fdf4}
.ril{font-size:12px;font-weight:600;color:var(--t1)}.ris{font-size:10px;color:var(--t3);margin-top:1px}
.radio{width:17px;height:17px;border-radius:50%;border:2px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:var(--g);background:var(--g)}.radio.on::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff}
/* checkbox */
.chk{width:19px;height:19px;border-radius:5px;border:2px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk.on{border-color:var(--g);background:var(--g)}.chk.on::after{content:'✓';font-size:10px;color:#fff;font-weight:700}
/* alert */
.alert{border-radius:var(--r12);padding:11px 12px;display:flex;gap:9px;align-items:flex-start}
.al-a{background:var(--aml);border:1px solid var(--amb)}.al-r{background:var(--rdl);border:1px solid var(--rdb)}
.al-b{background:var(--bll);border:1px solid var(--blb)}.al-g{background:#f0fdf4;border:1px solid #bbf7d0}
.al-p{background:var(--pul);border:1px solid var(--pub)}
.al-ic{font-size:13px;flex-shrink:0;margin-top:1px}
.al-tx{font-size:11px;font-weight:700;color:var(--t1);line-height:1.5}
.al-sb{font-size:10px;color:var(--t2);margin-top:2px;line-height:1.45}

/* ⚠ GAP BADGE — shows real-world operational gaps inline */
.gap-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:9px;font-weight:800;background:var(--gap-bg);border:1px solid var(--gap-bd);color:var(--gap-tx);letter-spacing:.04em;text-transform:uppercase}
.risk-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:9px;font-weight:800;background:var(--risk-bg);border:1px solid var(--risk-bd);color:var(--risk-tx);letter-spacing:.04em;text-transform:uppercase}

/* operational gap card */
.gap-card{background:var(--gap-bg);border:1px solid var(--gap-bd);border-radius:var(--r12);padding:11px 12px;margin-bottom:9px}
.gap-card-title{font-size:10px;font-weight:800;color:var(--gap-tx);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.gap-card-text{font-size:11px;color:#92400e;line-height:1.5}

/* risk card */
.risk-card{background:var(--risk-bg);border:1px solid var(--risk-bd);border-radius:var(--r12);padding:11px 12px;margin-bottom:9px}
.risk-card-title{font-size:10px;font-weight:800;color:var(--risk-tx);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.risk-card-text{font-size:11px;color:#991b1b;line-height:1.5}

/* ambiguity flag */
.amb-flag{background:#fdf4ff;border:1px solid #e9d5ff;border-radius:var(--r12);padding:10px 12px;margin-bottom:9px}
.amb-flag-title{font-size:10px;font-weight:800;color:#6b21a8;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.amb-flag-text{font-size:11px;color:#6b21a8;line-height:1.5}

/* timeline */
.tls{display:flex;gap:10px;align-items:flex-start}
.tl-d{width:9px;height:9px;border-radius:50%;border:2px solid var(--bd);background:var(--sf);flex-shrink:0;margin-top:3px}
.tl-d.dn{background:var(--g);border-color:var(--g)}.tl-d.ac{background:var(--bl);border-color:var(--bl);box-shadow:0 0 0 3px rgba(37,99,235,.15)}.tl-d.ma{background:var(--am);border-color:var(--am)}
.tl-l{width:2px;flex:1;min-height:18px;background:var(--bd);margin:3px 0}.tl-l.dn{background:var(--g)}.tl-l.ma{background:var(--am)}
.tl-b{padding-bottom:16px}.tl-lb{font-size:12px;font-weight:600;color:var(--t1)}.tl-sb{font-size:10px;color:var(--t3);margin-top:2px}
.tl-dim .tl-lb{color:var(--t3)}

/* note */
.note{font-size:11px;color:var(--t2);line-height:1.5;padding:9px 12px;background:var(--sf2);border-radius:7px;border-left:3px solid var(--bd2);margin-bottom:10px}

/* stat grid */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sbox{background:var(--sf2);border-radius:7px;padding:10px 12px}
.sl{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.sv{font-size:14px;font-weight:800;color:var(--t1)}.ss{font-size:9px;color:var(--t3);margin-top:1px}

/* success screen */
.scs{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 20px 20px}
.scs-ic{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px}
.scs-t{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:5px;letter-spacing:-.01em}
.scs-s{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:20px}

/* order item */
.oi{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--bd)}
.oi:last-child{border-bottom:none}
.oi-img{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#e8f5f0,#d1fae5);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.oi-n{font-size:12px;font-weight:700;color:var(--t1);margin-bottom:2px}.oi-s{font-size:10px;color:var(--t2)}
.oi-p{font-size:12px;font-weight:700;color:var(--t1);text-align:right;white-space:nowrap}

/* condition chips small */
.cc-row{display:flex;gap:5px;margin-top:7px}
.cc{flex:1;padding:6px 3px;border-radius:6px;border:1.5px solid var(--bd);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;cursor:pointer;text-align:center;color:var(--t2);background:var(--sf);transition:all .12s}
.cc.on{border-color:var(--g);color:var(--g);background:var(--gl)}.cc.on-r{border-color:var(--rd);color:var(--rd);background:var(--rdl)}

/* scenario cards */
.sc-c{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r12);padding:12px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .12s}
.sc-c:hover{border-color:var(--g)}.sc-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sc-n{font-size:12px;font-weight:700;color:var(--t1)}.sc-d{font-size:10px;color:var(--t3);margin-top:1px}

/* return type choice */
.rtype{background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--r16);padding:14px;margin-bottom:9px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:all .14s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rtype:hover{border-color:var(--g)}
.rtype-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rtype-t{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:3px}
.rtype-s{font-size:11px;color:var(--t2);line-height:1.4}
.rtype-tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:100px;margin-top:5px}

/* download card */
.dlc{background:var(--bll);border:1px solid var(--blb);border-radius:var(--r12);padding:13px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:9px}

/* select / textarea */
select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1.5px solid var(--bd);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--t1);background:var(--sf);margin-top:7px}
textarea{resize:none;min-height:64px;line-height:1.5}

/* cycle rows */
.cy{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);gap:9px}.cy:last-child{border-bottom:none}
.cy-n{width:26px;height:26px;border-radius:7px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--g);flex-shrink:0}
.cy-d{font-size:12px;font-weight:600;color:var(--t1);flex:1}.cy-s{font-size:10px;color:var(--t3)}

/* withdrawal info box */
.wd-info-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--r16);padding:14px;margin-bottom:12px}
.wd-info-title{font-size:12px;font-weight:700;color:var(--g);margin-bottom:10px}
.wd-info-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.wd-info-row:last-child{margin-bottom:0}
.wd-dot{width:5px;height:5px;border-radius:50%;background:var(--g);flex-shrink:0;margin-top:5px}
.wd-info-text{font-size:11px;color:var(--t1);line-height:1.5}
.wd-info-text strong{color:var(--g)}

/* section separator */
.ssep{padding:5px 14px 3px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}

/* refund breakdown */
.refund-row{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--bd)}
.refund-row:last-child{border-bottom:none}
.refund-k{font-size:12px;color:var(--t2);font-weight:500}
.refund-v{font-size:12px;font-weight:700;color:var(--t1)}
.refund-v.pos{color:#15803d}.refund-v.neg{color:var(--rd)}

/* manual step */
.manual-step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.manual-step:last-child{border-bottom:none}
.manual-num{width:22px;height:22px;border-radius:50%;background:var(--sf3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--t2);flex-shrink:0;margin-top:1px}
.manual-t{font-size:12px;font-weight:600;color:var(--t1)}.manual-s{font-size:10px;color:var(--t2);margin-top:1px;line-height:1.4}

/* opened-item blocked notice inline */
.blocked-notice{background:var(--rdl);border-left:3px solid var(--rd);border-radius:0 8px 8px 0;padding:8px 10px;margin:6px 0 0;font-size:10px;color:var(--rd);font-weight:600;line-height:1.4}

.dvd{height:1px;background:var(--bd);margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="dlabel">Zinzino · Subscription & Orders · Light mode</div>
<div class="phone">
  <!-- Status bar -->
  <div class="sbar">
    <span id="clk">09:41</span>
    <div style="display:flex;gap:4px;align-items:center">
      <svg width="13" height="9" viewBox="0 0 13 9"><rect x="0" y="3.5" width="2.5" height="5.5" rx=".8" fill="currentColor"/><rect x="3.5" y="2" width="2.5" height="7" rx=".8" fill="currentColor"/><rect x="7" y=".5" width="2.5" height="8.5" rx=".8" fill="currentColor"/><rect x="10.5" y="0" width="2" height="9" rx=".8" fill="currentColor" opacity=".3"/></svg>
      <svg width="12" height="9" viewBox="0 0 12 9"><path d="M6 2C7.7 2 9.2 2.7 10.3 3.8L11.5 2.6C10.1 1.3 8.1.4 6 .4 3.9.4 1.9 1.3.5 2.6L1.7 3.8C2.8 2.7 4.3 2 6 2Z" fill="currentColor"/><path d="M6 4.5C7 4.5 7.8 4.9 8.5 5.5L9.7 4.3C8.6 3.4 7.4 2.9 6 2.9 4.6 2.9 3.4 3.4 2.3 4.3L3.5 5.5C4.2 4.9 5 4.5 6 4.5Z" fill="currentColor"/><circle cx="6" cy="7.8" r="1.3" fill="currentColor"/></svg>
      <svg width="21" height="9" viewBox="0 0 21 9"><rect x="0" y=".8" width="17" height="7.2" rx="2" stroke="currentColor" stroke-width="1.1" fill="none"/><rect x="17.4" y="2.7" width="1.8" height="3.6" rx=".9" fill="currentColor" opacity=".4"/><rect x="1.1" y="2" width="12" height="5" rx="1.3" fill="currentColor"/></svg>
    </div>
  </div>
  <!-- Nav -->
  <div class="nav">
    <div class="nav-back h" id="nav-back" onclick="goBack()">‹</div>
    <div class="nav-title" id="nav-title">Subscription & Orders</div>
    <div class="nav-ghost"></div>
  </div>
  <!-- Screen -->
  <div class="scr" id="scr"></div>
  <!-- Bottom nav -->
  <div class="bnav">
    <div class="bni"><div class="bni-ic">🏠</div><div class="bni-lb">Home</div></div>
    <div class="bni on"><div class="bni-ic">📦</div><div class="bni-lb">Orders</div></div>

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function wdRow(o){
  const cond = itemConds[o.id];
  const sel  = selItems[o.id];
  return `<div id="wdi${o.id}">
    <div class="oi" style="cursor:pointer" onclick="toggleWD(${o.id})">
      <div class="oi-img">${o.e}</div>
      <div style="flex:1"><div class="oi-n">${o.n}</div><div class="oi-s">${o.q}</div></div>
      <div class="oi-p" style="margin-right:10px">€${o.p.toFixed(2)}</div>
      <div class="chk ${sel?'on':''}" id="wdchk${o.id}"></div>
    </div>
    ${sel?`
    <div style="padding:0 14px 12px">
      <div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Condition of this item</div>
      <div class="cc-row">
        <div class="cc ${cond==='unopened'?'on':''}" id="wdcu${o.id}" onclick="setWDCond(${o.id},'unopened',event)">Unopened</div>
        <div class="cc ${cond==='opened'?'on-r':''}" id="wdco${o.id}" onclick="setWDCond(${o.id},'opened',event)">Opened</div>
      </div>
      ${cond==='opened'?`<div class="blocked-notice">⚠ Opened item — retail price (€${o.p.toFixed(2)}) will be <strong>deducted from your refund</strong>. Product can still be returned.</div>`:''}
    </div>`:''}
  </div>`;
}

function toggleWD(id){
  selItems[id] = !selItems[id];
  if(!selItems[id]) itemConds[id]=null;
  rebuildWDList(); updateWDWarnings();
}
function setWDCond(id,c,e){
  e.stopPropagation();
  itemConds[id]=c;
  rebuildWDList(); updateWDWarnings();
}
function rebuildWDList(){
  const wrap = document.getElementById('wd-item-list');
  if(wrap) wrap.innerHTML = ORDERS.map(o=>wdRow(o)).join('');
}
function updateWDWarnings(){
  const wb = document.getElementById('wd-warn-block');
  const wt = document.getElementById('wd-warn-text');
  if(!wb||!wt) return;
  const opened = ORDERS.filter(o=>selItems[o.id]&&itemConds[o.id]==='opened');
  if(opened.length){
    wb.style.display='block';
    const tot = opened.reduce((a,o)=>a+o.p,0);
    wt.textContent = `${opened.map(o=>o.n).join(', ')} — opened items. €${tot.toFixed(2)} will be deducted from your refund. These items can still be included in the return.`;
  } else { wb.style.display='none'; }
}
function wdProceed(){
  const anySelected = ORDERS.some(o=>selItems[o.id]);
  if(!anySelected){ alert('Please select at least one item to return.'); return; }
  const needsCond = ORDERS.filter(o=>selItems[o.id]&&!itemConds[o.id]);
  if(needsCond.length){ alert(`Please select the condition for: ${needsCond.map(o=>o.n).join(', ')}`); return; }
  go('WD_SUM');
}
function toggleCO(id){
  selItems[id]=!selItems[id];
  const c=document.getElementById('coc'+id);
  if(c) c.className='chk '+(selItems[id]?'on':'');
}
function coProceed(){
  if(!ORDERS.some(o=>selItems[o.id])){ alert('Please select at least one item.'); return; }
  go('CO_D');
}
function setCCond(id,c){
  document.getElementById('cc'+id+'u').className='cc '+(c==='u'?'on':'');
  document.getElementById('cc'+id+'o').className='cc '+(c==='o'?'on':'');
}
function setIss(id,val){
  const el=document.getElementById('oth'+id);
  if(el) el.style.display=val==='other'?'block':'none';
}
function selP(i){
  const d=['15 May','15 Jun','15 Jul'];
  document.querySelectorAll('[id^="pc"]').forEach((c,idx)=>c.className='chip'+(idx===i?' on':''));
  const pr=document.getElementById('pr'); if(pr) pr.textContent=d[i];
}
function selCR(key,offer){
  document.querySelectorAll('[id^="ri_"]').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('[id^="rr_"]').forEach(el=>el.classList.remove('on'));
  document.getElementById('ri_'+key)?.classList.add('on');
  document.getElementById('rr_'+key)?.classList.add('on');
  const ob=document.getElementById('offer-blk');
  if(ob){ ob.style.display='block'; ob.innerHTML=`<div class="alert al-g"><div class="al-ic">💡</div><div><div class="al-tx">Offer for you</div><div class="al-sb">${offer}</div></div></div><button class="btn btn-p" onclick="go('PAUSE_C')" style="margin-bottom:0">Accept this offer</button>`; }
}
function selWR(i){
  document.querySelectorAll('[id^="wdr"]').forEach((el,idx)=>{ el.classList.toggle('on',idx===i); document.getElementById('wdrr'+idx)?.classList.toggle('on',idx===i); });
  const ot=document.getElementById('wd-other'); if(ot) ot.style.display=i===4?'block':'none';
}
function tick(){
  const n=new Date(), h=String(n.getHours()).padStart(2,'0'), m=String(n.getMinutes()).padStart(2,'0');
  const c=document.getElementById('clk'); if(c) c.textContent=h+':'+m;
}
tick(); setInterval(tick,15000);
render();
</script>
</body>
</html>
