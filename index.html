<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zinzino · Return</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --k-black:#1A1A1A;--k-gray1:#F5F5F5;--k-gray2:#E8E8E8;--k-gray3:#ADADAD;--k-gray4:#666;
  --k-green:#00A67E;--k-green-bg:#E6F7F2;--k-green-light:#D1FAE5;
  --k-red:#E53E3E;--k-red-bg:#FFF5F5;
  --k-blue:#0055FF;--k-blue-bg:#F0F4FF;
  --k-amber:#C05621;--k-amber-bg:#FFFBEB;
  --sf:#fff;--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#EDEDED;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px 52px}
.wrap{display:flex;flex-direction:column;align-items:center}
.dlabel{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#999;margin-bottom:10px}
.phone{width:375px;max-width:calc(100vw - 24px);background:#fff;border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 32px 72px rgba(0,0,0,.16);display:flex;flex-direction:column}
.sbar{background:#fff;padding:13px 26px 5px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--k-black);flex-shrink:0}
.nav{background:#fff;padding:10px 18px 13px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-btn{width:34px;height:34px;border-radius:50%;background:var(--k-gray1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--k-black);flex-shrink:0;font-weight:400;line-height:1;transition:background .1s;border:none}
.back-btn:hover{background:var(--k-gray2)}.back-btn.h{visibility:hidden;pointer-events:none}
.nav-title{font-size:15px;font-weight:700;color:var(--k-black);flex:1;text-align:center}
.nav-ghost{width:34px;flex-shrink:0}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;background:#fff;min-height:520px;max-height:568px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.bnav{background:#fff;border-top:1px solid var(--k-gray2);padding:8px 0 18px;display:flex;justify-content:space-around;flex-shrink:0}
.bni{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 12px;opacity:.3}
.bni.on{opacity:1}.bni-ic{font-size:20px}.bni-l{font-size:9px;font-weight:600;color:var(--k-black)}
.pid{margin-top:9px;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#aaa}
@keyframes fs{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* Steps */
.steps{display:flex;justify-content:center;gap:6px;padding:16px 0 6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--k-gray2);transition:all .2s}
.dot.active{background:var(--k-black);width:18px;border-radius:100px}
.dot.done{background:var(--k-gray3)}
.steplbl{font-size:11px;color:var(--k-gray3);text-align:center;margin-bottom:16px;font-weight:500}
/* Card */
.kcard{background:#fff;border-radius:var(--radius);border:1px solid var(--k-gray2);margin-bottom:10px;overflow:hidden}
.cr{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--k-gray2)}.cr:last-child{border-bottom:none}
.ck{font-size:13px;color:var(--k-gray4);font-weight:500}.cv{font-size:13px;color:var(--k-black);font-weight:600}
/* Buttons */
.btn{width:100%;padding:16px 20px;border-radius:100px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;border:none;margin-bottom:10px;transition:opacity .1s,transform .1s;letter-spacing:-.01em}
.btn:active{transform:scale(.98);opacity:.85}
.btn-black{background:var(--k-black);color:#fff}
.btn-outline{background:#fff;color:var(--k-black);border:2px solid var(--k-black)}
.btn-ghost{background:transparent;color:var(--k-gray3);font-size:13px;font-weight:600;text-decoration:underline;text-decoration-color:var(--k-gray2)}
/* Product row */
.prod-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--k-gray2)}.prod-row:last-child{border-bottom:none}
.prod-img{width:46px;height:46px;border-radius:12px;background:var(--k-gray1);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.prod-name{font-size:13px;font-weight:700;color:var(--k-black);margin-bottom:2px}.prod-sub{font-size:11px;color:var(--k-gray3)}
.prod-price{font-size:13px;font-weight:700;color:var(--k-black);white-space:nowrap;margin-left:auto}
/* Checkbox */
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--k-gray2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s;cursor:pointer;background:#fff}
.chk.on{border-color:var(--k-black);background:var(--k-black)}.chk.on::after{content:'✓';font-size:12px;color:#fff;font-weight:700}
/* Condition chips */
.ccs{display:flex;gap:7px;margin-top:10px}
.cc{flex:1;padding:9px 4px;border-radius:100px;border:1.5px solid var(--k-gray2);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;color:var(--k-gray4);background:#fff;transition:all .12s}
.cc.on{border-color:var(--k-black);color:var(--k-black);background:var(--k-gray1)}.cc.on-r{border-color:var(--k-red);color:var(--k-red);background:var(--k-red-bg)}
.note-ok{background:var(--k-gray1);border-radius:10px;padding:10px 13px;margin-top:9px;font-size:12px;color:var(--k-black);font-weight:600;line-height:1.4}
.note-warn{background:var(--k-red-bg);border-radius:10px;padding:10px 13px;margin-top:9px;font-size:12px;color:var(--k-red);font-weight:600;line-height:1.4}
/* Radio */
.ri{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--k-gray2);cursor:pointer;transition:background .1s}
.ri:last-child{border-bottom:none}.ri:hover{background:var(--k-gray1)}.ri.on{background:var(--k-gray1)}
.ril{font-size:14px;font-weight:600;color:var(--k-black)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--k-gray2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s}
.radio.on{border-color:var(--k-black);background:var(--k-black)}.radio.on::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff}
/* Suggest */
.suggest-card{background:var(--k-gray1);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1.5px solid var(--k-gray2)}
/* Refund rows */
.rfr{display:flex;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--k-gray2)}.rfr:last-child{border-bottom:none}
.rfk{font-size:13px;color:var(--k-gray4);font-weight:500}.rfv{font-size:13px;font-weight:700;color:var(--k-black)}.rfv.neg{color:var(--k-red)}
/* Timeline */
.tls{display:flex;gap:12px;align-items:flex-start}
.tl-d{width:10px;height:10px;border-radius:50%;border:2px solid var(--k-gray2);background:#fff;flex-shrink:0;margin-top:3px}
.tl-d.ac{background:var(--k-black);border-color:var(--k-black)}
.tl-l{width:2px;flex:1;min-height:18px;background:var(--k-gray2);margin:3px 0}
.tl-b{padding-bottom:16px}
.tl-label{font-size:13px;font-weight:600;color:var(--k-black)}.tl-sub{font-size:11px;color:var(--k-gray3);margin-top:2px}
.tls.dim .tl-label{color:var(--k-gray3)}
/* Success */
.scs{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 22px 24px}
.label-card{background:var(--k-black);border-radius:var(--radius);padding:16px;display:flex;gap:13px;align-items:center;cursor:pointer;margin-bottom:12px;width:100%}
.section-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--k-gray3);padding:14px 18px 8px}
textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--k-gray2);font-family:'Inter',sans-serif;font-size:13px;color:var(--k-black);background:#fff;resize:none;min-height:72px;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="dlabel">Zinzino · Right of Withdrawal</div>
<div class="phone">
  <div class="sbar">
    <span id="clk">09:41</span>
    <div style="display:flex;gap:4px;align-items:center">
      <svg width="13" height="9" viewBox="0 0 13 9"><rect x="0" y="3.5" width="2.5" height="5.5" rx=".8" fill="currentColor"/><rect x="3.5" y="2" width="2.5" height="7" rx=".8" fill="currentColor"/><rect x="7" y=".5" width="2.5" height="8.5" rx=".8" fill="currentColor"/><rect x="10.5" y="0" width="2" height="9" rx=".8" fill="currentColor" opacity=".3"/></svg>
      <svg width="12" height="9" viewBox="0 0 12 9"><path d="M6 2C7.7 2 9.2 2.7 10.3 3.8L11.5 2.6C10.1 1.3 8.1.4 6 .4 3.9.4 1.9 1.3.5 2.6L1.7 3.8C2.8 2.7 4.3 2 6 2Z" fill="currentColor"/><circle cx="6" cy="7.8" r="1.3" fill="currentColor"/></svg>
      <svg width="21" height="9" viewBox="0 0 21 9"><rect x="0" y=".8" width="17" height="7.2" rx="2" stroke="currentColor" stroke-width="1.1" fill="none"/><rect x="1.1" y="2" width="12" height="5" rx="1.3" fill="currentColor"/></svg>
    </div>
  </div>
  <div class="nav">
    <button class="back-btn h" id="nb" onclick="goBack()">‹</button>
    <div class="nav-title" id="nt">My Orders</div>
    <div class="nav-ghost"></div>
  </div>
  <div class="scr" id="scr"></div>
  <div class="bnav">
    <div class="bni"><div class="bni-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><div class="bni-l">Home</div></div>
    <div class="bni on"><div class="bni-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg></div><div class="bni-l">Orders</div></div>
    <div class="bni"><div class="bni-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="bni-l">Account</div></div>
    <div class="bni"><div class="bni-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div class="bni-l">Support</div></div>
  </div>
</div>
<div class="pid" id="pid">ORDER</div>
</div>

<script>
let hist=[], cur='ORDER', sel={}, cond={};
const ICONS={
  clock:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  pause:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
  box:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,
  tag:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  pin:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  check:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  pen:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  bottle:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v2.5c0 .5-.2 1-.6 1.4L7 9.5V19a2 2 0 002 2h6a2 2 0 002-2V9.5l-2.4-2.6c-.4-.4-.6-.9-.6-1.4V3"/><line x1="7" y1="14" x2="17" y2="14"/></svg>`,
  vial:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2v9.5L20 18a2 2 0 01-1.73 3H5.73A2 2 0 014 18l5.5-6.5V2"/><line x1="8.5" y1="2" x2="15.5" y2="2"/><path d="M7 13h10"/></svg>`,
  hourglass:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 00-.586-1.414L12 12l-4.414 4.414A2 2 0 007 17.828V22"/><path d="M7 2v4.172a2 2 0 00.586 1.414L12 12l4.414-4.414A2 2 0 0017 6.172V2"/></svg>`,
  label:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
};
const ITEMS=[
  {id:1, n:'BalanceOil+', sub:'300ml · Lemon', p:79, ic:'bottle'},
  {id:2, n:'BalanceTest', sub:'Blood spot test · Take now', p:19, ic:'vial'},
];
const TITLES={ORDER:'My Orders',WD_SELECT:'Select items',WD_SUMMARY:'Return summary',WD_REASON:'One more thing',WD_DONE:''};

function go(s){hist.push(cur);cur=s;render()}
function goBack(){if(hist.length){cur=hist.pop();render()}}
function render(){
  const el=document.getElementById('scr');el.scrollTop=0;
  document.getElementById('nt').textContent=TITLES[cur]||'';
  document.getElementById('pid').textContent=cur;
  const nb=document.getElementById('nb');
  hist.length?nb.classList.remove('h'):nb.classList.add('h');
  el.innerHTML='';(SC[cur]||SC.ORDER)(el);
}
const B=(l,c,a)=>`<button class="btn ${c}" onclick="${a}">${l}</button>`;
function stps(n,t){return`<div class="steps">${Array.from({length:t},(_,i)=>`<div class="dot ${i<n-1?'done':i===n-1?'active':''}"></div>`).join('')}</div><div class="steplbl">Step ${n} of ${t}</div>`;}

const SC={

ORDER(el){el.innerHTML=`<div style="animation:fs .18s ease">
<div style="padding:20px 18px 14px">
  <div style="font-size:12px;font-weight:600;color:var(--k-gray3);margin-bottom:4px">#ZIN-20260310 · 10 Mar 2026</div>
  <div style="font-size:24px;font-weight:900;color:var(--k-black);letter-spacing:-.04em;line-height:1.2;margin-bottom:2px">Premier Kit —<br>Balance</div>
  <div style="font-size:14px;color:var(--k-gray4);margin-top:4px">Delivered ✓</div>
</div>
<div class="kcard" style="margin:0 16px 14px">
  <div class="prod-row"><div class="prod-img">${ICONS.bottle}</div><div style="flex:1"><div class="prod-name">BalanceOil+</div><div class="prod-sub">300ml · Lemon</div></div><div class="prod-price">€79.00</div></div>
  <div class="prod-row"><div class="prod-img">${ICONS.vial}</div><div style="flex:1"><div class="prod-name">BalanceTest × 2</div><div class="prod-sub">Test now + after 120 days</div></div><div class="prod-price">€19.00</div></div>
  <div style="padding:13px 18px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--k-gray2)">
    <span style="font-size:13px;color:var(--k-gray4)">Total</span>
    <span style="font-size:17px;font-weight:800;color:var(--k-black)">€98.00</span>
  </div>
</div>
<div style="padding:0 16px">
  <div style="background:var(--k-gray1);border:1px solid var(--k-gray2);border-radius:14px;padding:14px 16px;display:flex;gap:11px;align-items:flex-start;margin-bottom:14px">
    <span style="flex-shrink:0;color:var(--k-black)">${ICONS.clock}</span>
    <div>
      <div style="font-size:14px;font-weight:700;color:var(--k-black)">22 days left to return</div>
      <div style="font-size:12px;color:var(--k-gray4);margin-top:2px">Must be initiated by 24 Mar 2026</div>
    </div>
  </div>
  ${B('Return this order','btn-black',"go('WD_SELECT')")}
</div>
</div>`},

WD_SELECT(el){
ITEMS.forEach(o=>{if(sel[o.id]===undefined){sel[o.id]=false;cond[o.id]=null;}});
el.innerHTML=`<div style="animation:fs .18s ease;padding-bottom:24px">
<div style="padding:18px 18px 8px">
${stps(1,3)}
<div style="font-size:26px;font-weight:900;color:var(--k-black);letter-spacing:-.04em;line-height:1.2;margin-bottom:6px">What would you<br>like to return?</div>
</div>
<div class="kcard" style="margin:0 16px" id="ilist">
  <div style="display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--k-gray2);cursor:pointer;background:var(--k-gray1)" onclick="toggleWholeKit()">
    <div class="chk" id="chk-whole"></div>
    <div style="flex:1">
      <div style="font-size:14px;font-weight:700;color:var(--k-black)">Select all items</div>
      <div style="font-size:12px;color:var(--k-gray3);margin-top:1px">Premier Kit — Balance (2 items)</div>
    </div>
  </div>
  ${ITEMS.map(o=>iRow(o)).join('')}
</div>
<div id="warnbox" style="margin:9px 16px 0;display:none;background:var(--k-red-bg);border:1px solid #FECACA;border-radius:10px;padding:10px 13px;font-size:12px;color:var(--k-red);font-weight:600;line-height:1.5"></div>
<div style="padding:0 16px;margin-top:12px">
  ${B('Continue','btn-black','proceed()')}
  ${B('Cancel','btn-ghost','goBack()')}
</div>
</div>`},

WD_SUMMARY(el){
const un=ITEMS.filter(o=>sel[o.id]&&cond[o.id]==='u');
const op=ITEMS.filter(o=>sel[o.id]&&cond[o.id]==='o');
const full=un.reduce((a,o)=>a+o.p,0),ded=op.reduce((a,o)=>a+o.p,0),ref=full-ded;
el.innerHTML=`<div style="animation:fs .18s ease;padding-bottom:24px">
<div style="padding:18px 18px 8px">
${stps(2,3)}
<div style="font-size:26px;font-weight:900;color:var(--k-black);letter-spacing:-.04em;line-height:1.2;margin-bottom:6px">Review your<br>return</div>
</div>
<div style="padding:0 16px 4px">
  <div style="background:var(--k-gray1);border:1px solid var(--k-gray2);border-radius:14px;padding:14px 15px;display:flex;gap:11px;align-items:flex-start;margin-bottom:12px">
    <div style="width:34px;height:34px;border-radius:50%;background:var(--k-gray2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--k-black)">${ICONS.pause}</div>
    <div>
      <div style="font-size:13px;font-weight:700;color:var(--k-black)">Subscription paused immediately</div>
      <div style="font-size:12px;color:var(--k-gray4);margin-top:2px">No further charges while we process your return</div>
    </div>
  </div>
</div>
<div class="section-lbl">Items being returned</div>
<div class="kcard" style="margin:0 16px 12px">
  ${[...un,...op].map(o=>`<div class="prod-row"><div class="prod-img" style="color:var(--k-gray4)">${ICONS[o.ic]||''}</div><div style="flex:1"><div class="prod-name">${o.n}</div><div style="font-size:11px;font-weight:600;color:var(--k-gray4)">${cond[o.id]==='o'?'Opened':'Unopened'}</div></div><div class="prod-price">€${o.p.toFixed(2)}</div></div>`).join('')}
  ${ded>0?`<div class="rfr"><span class="rfk">Opened items deducted</span><span class="rfv neg">−€${ded.toFixed(2)}</span></div>`:''}
  <div style="padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:var(--k-gray1)">
    <span style="font-size:15px;font-weight:800;color:var(--k-black)">Your refund</span>
    <span style="font-size:24px;font-weight:900;color:var(--k-black);letter-spacing:-.04em">€${ref.toFixed(2)}</span>
  </div>
</div>
<div class="kcard" style="margin:0 16px 16px">
  <div style="padding:16px 18px 4px">
    <div style="font-size:15px;font-weight:800;color:var(--k-black);margin-bottom:3px">Return Instructions</div>
    <div style="font-size:13px;color:var(--k-gray3);margin-bottom:12px">Everything you need to know</div>
  </div>
  ${[
    {id:'acc1', icon:ICONS.box,  title:'How to pack your return', body:'Pack the items securely in the original box if possible. If not, use any sturdy box. Make sure items are well protected to avoid damage in transit.'},
    {id:'acc2', icon:ICONS.tag,  title:'Shipping label & timeline', body:'A prepaid return label will be sent to your email within 1–3 business days. Print it and attach it to the outside of the box. Drop off at any DHL location.'},
    {id:'acc3', icon:ICONS.pin,  title:'Return shipping address', body:'', bodyHtml:`<div style="font-size:13px;color:var(--k-gray4);line-height:1.6;margin-bottom:12px">Zinzino Returns<br>Lilla Bommen 1<br>411 04 Gothenburg<br>Sweden</div><button onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:7px;background:var(--k-gray1);border:1.5px solid var(--k-gray2);border-radius:100px;padding:8px 14px;font-family:Inter,sans-serif;font-size:12px;font-weight:700;color:var(--k-black);cursor:pointer">${ICONS.pen} Change address</button>`},
  ].map(a=>`
  <div style="border-top:1px solid var(--k-gray2)">
    <div onclick="toggleAcc('${a.id}')" style="display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer">
      <div style="width:20px;flex-shrink:0;color:var(--k-gray4)">${a.icon}</div>
      <span style="font-size:14px;font-weight:600;color:var(--k-black);flex:1">${a.title}</span>
      <span id="${a.id}-arrow" style="font-size:12px;color:var(--k-gray3);transition:transform .2s;display:block">⌄</span>
    </div>
    <div id="${a.id}" style="display:none;padding:0 18px 15px 48px">${a.bodyHtml || `<span style="font-size:13px;color:var(--k-gray4);line-height:1.6;white-space:pre-line">${a.body}</span>`}</div>
  </div>`).join('')}
</div>
<div style="padding:0 16px">
  ${B('Confirm return','btn-black',"go('WD_REASON')")}
  ${B('Back','btn-ghost','goBack()')}
</div>
</div>`},

WD_REASON(el){
const rs=[
  {l:"I changed my mind",suggestion:null},
  {l:"I won't start using it",suggestion:{title:'Pause instead?',body:"Pause your subscription and come back when you're ready. No charges, no commitment.",cta:'Pause subscription'}},
  {l:"The price is too high",suggestion:{title:'There\'s a smaller option',body:'BalanceOil+ also comes in 100ml at a lower price. Switch instead of returning?',cta:'See lower-cost option'}},
  {l:"Delivery took too long",suggestion:{title:'Skip the next delivery',body:"We're sorry for the wait. Would you like to skip the next delivery instead?",cta:'Skip next delivery'}},
  {l:"Other reason",suggestion:null},
];
el.innerHTML=`<div style="animation:fs .18s ease;padding-bottom:24px">
<div style="padding:18px 18px 8px">
${stps(3,3)}
<div style="font-size:26px;font-weight:900;color:var(--k-black);letter-spacing:-.04em;line-height:1.2;margin-bottom:6px">Why are you<br>returning?</div>
<div style="font-size:14px;color:var(--k-gray4);margin-bottom:16px">Optional — you can skip this step.</div>
</div>
<div class="kcard" style="margin:0 16px 12px">
${rs.map((r,i)=>`<div class="ri" id="r${i}" onclick="selR(${i})"><div class="ril" id="rl${i}">${r.l}</div><div class="radio" id="rr${i}"></div></div>`).join('')}
</div>
<div id="suggestion-block" style="margin:0 16px 12px;display:none"></div>
<div id="other-wrap" style="margin:0 16px 12px;display:none"><textarea placeholder="Tell us more..."></textarea></div>
<div style="padding:0 16px">
  ${B('Submit and confirm return','btn-black',"go('WD_DONE')")}
  ${B('Skip','btn-ghost',"go('WD_DONE')")}
</div>
</div>`;
window._reasons=rs;},

WD_DONE(el){el.innerHTML=`<div class="scs" style="animation:fs .18s ease">
<div style="width:72px;height:72px;border-radius:50%;background:var(--k-gray1);border:2px solid var(--k-gray2);display:flex;align-items:center;justify-content:center;color:var(--k-black);margin-bottom:18px">${ICONS.check}</div>
<div style="font-size:28px;font-weight:900;color:var(--k-black);letter-spacing:-.04em;margin-bottom:8px">Return<br>confirmed</div>
<div style="font-size:14px;color:var(--k-gray4);line-height:1.65;margin-bottom:26px">Your return is registered.<br>We'll email a return label within 1–3 business days.</div>
<div class="kcard" style="width:100%;text-align:left;margin-bottom:14px">
<div class="cr"><span class="ck">Case ID</span><span class="cv">WD-2026-04821</span></div>
<div class="cr"><span class="ck">Refund</span><span style="font-size:15px;font-weight:800;color:var(--k-black)">€79.00</span></div>
<div class="cr"><span class="ck">Return by</span><span style="font-size:13px;font-weight:700;color:var(--k-black)">24 Mar 2026</span></div>
<div class="cr"><span class="ck">Subscription</span><span style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--k-gray4)"><span style="color:var(--k-gray3)">${ICONS.pause}</span> Paused</span></div>
<div class="cr"><span class="ck">Return label</span><span style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--k-gray3)"><span>${ICONS.hourglass}</span> Sent to email</span></div>
</div>
<div class="label-card">
  <div style="width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${ICONS.label}</div>
  <div style="flex:1"><div style="font-size:13px;font-weight:700;color:#fff">Return label — check your email</div><div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px">Prepaid · Sent within 1–3 business days</div></div>
</div>
<div style="width:100%;text-align:left;margin-bottom:6px">
  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--k-gray3);margin-bottom:12px">What happens next</div>
  ${[{l:'Support creates return label',d:'1–3 business days',s:'ac'},{l:'Label sent to your email',d:'',s:''},{l:'You return the package',d:'By 24 Mar 2026',s:''},{l:'Warehouse confirms receipt',d:'',s:''},{l:'Refund processed',d:'5–10 business days',s:''}].map((s,i,arr)=>`<div class="tls ${!s.s?'dim':''}"><div style="display:flex;flex-direction:column;align-items:center"><div class="tl-d ${s.s}"></div>${i<arr.length-1?'<div class="tl-l"></div>':''}</div><div class="tl-b"><div class="tl-label">${s.l}</div>${s.d?`<div class="tl-sub">${s.d}</div>`:''}</div></div>`).join('')}
</div>
<div style="width:100%;margin-top:8px">${B('Back to my orders','btn-black',"go('ORDER')")}</div>
</div>`},
};

function iRow(o){const s=sel[o.id],c=cond[o.id];
return`<div id="irow${o.id}">
<div style="display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--k-gray2);cursor:pointer" onclick="tI(${o.id})">
  <div class="chk ${s?'on':''}" id="chk${o.id}"></div>
  <div class="prod-img" style="color:var(--k-gray4)">${ICONS[o.ic]||''}</div>
  <div style="flex:1"><div class="prod-name">${o.n}</div><div class="prod-sub">${o.sub}</div></div>
  <div class="prod-price">€${o.p.toFixed(2)}</div>
</div>
${s?`<div style="padding:10px 18px 14px;background:var(--k-gray1);border-bottom:1px solid var(--k-gray2)">
  <div style="font-size:11px;font-weight:700;color:var(--k-gray3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px">Condition</div>
  <div class="ccs">
    <div class="cc ${c==='u'?'on':''}" onclick="sC(${o.id},'u',event)">Unopened</div>
    <div class="cc ${c==='o'?'on-r':''}" onclick="sC(${o.id},'o',event)">Opened</div>
  </div>
  ${c==='u'?`<div class="note-ok">✓ Full refund of €${o.p.toFixed(2)}</div>`:''}
  ${c==='o'?`<div class="note-warn">⚠ €${o.p.toFixed(2)} will be deducted — opened items cannot be fully refunded.</div>`:''}
</div>`:''}
</div>`;}

function tI(id){sel[id]=!sel[id];if(!sel[id])cond[id]=null;rL();uW();}
function sC(id,c,e){e.stopPropagation();cond[id]=c;rL();uW();}
function toggleWholeKit(){
  const all=ITEMS.every(o=>sel[o.id]);
  ITEMS.forEach(o=>{sel[o.id]=!all;if(!sel[o.id])cond[o.id]=null;});
  rL();uW();
}
function rL(){
  const w=document.getElementById('ilist');if(!w)return;
  const hdr=w.querySelector('[onclick="toggleWholeKit()"]');
  w.innerHTML='';
  if(hdr)w.appendChild(hdr);
  ITEMS.forEach(o=>{const t=document.createElement('div');t.innerHTML=iRow(o);while(t.firstChild)w.appendChild(t.firstChild);});
  const wc=document.getElementById('chk-whole');
  if(wc)wc.className='chk '+(ITEMS.every(o=>sel[o.id])?'on':'');
}
function uW(){
  const wb=document.getElementById('warnbox');if(!wb)return;
  const op=ITEMS.filter(o=>sel[o.id]&&cond[o.id]==='o');
  if(op.length){wb.style.display='block';const t=op.reduce((a,o)=>a+o.p,0);wb.textContent=`⚠ ${op.map(o=>o.n).join(', ')} marked as opened — €${t.toFixed(2)} will be deducted.`;}
  else wb.style.display='none';
}
function proceed(){
  if(!ITEMS.some(o=>sel[o.id])){alert('Please select at least one item.');return;}
  const nc=ITEMS.filter(o=>sel[o.id]&&!cond[o.id]);
  if(nc.length){alert('Please mark the condition for: '+nc.map(o=>o.n).join(', '));return;}
  go('WD_SUMMARY');
}
function selR(i){
  const rs=window._reasons||[];
  for(let x=0;x<rs.length;x++){
    const row=document.getElementById('r'+x),radio=document.getElementById('rr'+x),lbl=document.getElementById('rl'+x);
    if(!row)continue;const active=x===i;
    row.classList.toggle('on',active);
    if(radio)radio.classList.toggle('on',active);
    if(lbl)lbl.style.fontWeight=active?'700':'600';
  }
  const ow=document.getElementById('other-wrap');if(ow)ow.style.display=i===4?'block':'none';
  const sb=document.getElementById('suggestion-block');if(!sb)return;
  const r=rs[i];
  if(r&&r.suggestion){
    const s=r.suggestion;
    sb.style.display='block';
    sb.innerHTML=`<div class="suggest-card"><div style="font-size:14px;font-weight:800;color:var(--k-black);margin-bottom:5px">${s.title}</div><div style="font-size:12px;color:var(--k-gray4);line-height:1.55;margin-bottom:13px">${s.body}</div><button class="btn btn-outline" onclick="go('ORDER')" style="margin-bottom:0;font-size:13px;padding:12px 16px">${s.cta} →</button></div>`;
  } else {sb.style.display='none';sb.innerHTML='';}
}
function toggleAcc(id){
  const body=document.getElementById(id);
  const arrow=document.getElementById(id+'-arrow');
  if(!body)return;
  const open=body.style.display==='block';
  body.style.display=open?'none':'block';
  if(arrow)arrow.style.transform=open?'':'rotate(180deg)';
}
function tick(){const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');const c=document.getElementById('clk');if(c)c.textContent=h+':'+m;}
tick();setInterval(tick,15000);
render();
</script>
</body>
</html>
